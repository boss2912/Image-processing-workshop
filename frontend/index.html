<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Processing Client</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Image Processing Client</h1>
  <p class="sub">310-3311 Image Processing &middot; Workshop Lecture 9</p>

  <div class="row">
    <input type="file" id="file-input" accept="image/*">
    <button id="process-btn" type="button">ประมวลผล</button>
  </div>

  <p id="status"></p>

  <div class="results">
    <figure>
      <figcaption>ภาพต้นฉบับ (เครื่องผู้ใช้)</figcaption>
      <img id="source-image" alt="ภาพต้นฉบับ">
    </figure>
    <figure>
      <figcaption>ผลลัพธ์ (ประมวลผลที่เครื่องเซิร์ฟเวอร์)</figcaption>
      <img id="result-image" alt="ภาพผลลัพธ์">
    </figure>
  </div>

  <script src="app.js"></script>
</body>
</html>
