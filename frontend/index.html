<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Processing Client</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Image Processing Client</h1>
    <p class="sub">310-3311 Image Processing &middot; Workshop Lecture 9 &mdash; Edge and Corner Detection</p>
  </header>

  <main>
    <!-- เลือก operation (dropdown สร้างอัตโนมัติจาก GET /api/operations) -->
    <section class="card" id="operation-card">
      <h2>เลือก Operation</h2>
      <div class="row">
        <label for="operation">Operation</label>
        <select id="operation"></select>
      </div>
      <p class="hint" id="operation-owner"></p>
      <div id="params"></div>
    </section>

    <!-- อัปโหลดภาพแล้วส่งไปประมวลผล -->
    <section class="card" id="upload-card">
      <h2>เลือกภาพแล้วประมวลผล</h2>
      <div class="row">
        <input type="file" id="file-input" accept="image/*">
        <button id="process-btn" type="button" disabled>ประมวลผล</button>
      </div>
    </section>

    <p id="status" class="status"></p>

    <!-- ผลลัพธ์: ภาพต้นฉบับ (ฝั่ง client) เทียบกับภาพที่ประมวลผลแล้ว (ส่งกลับมาจาก server) -->
    <section class="results">
      <figure>
        <figcaption>ภาพต้นฉบับ (ในเครื่อง client)</figcaption>
        <div class="image-box">
          <div id="source-placeholder" class="placeholder">ยังไม่ได้เลือกรูปภาพ</div>
          <img id="source-image" alt="ภาพต้นฉบับ" style="display: none;">
        </div>
      </figure>
      <figure>
        <figcaption>ผลลัพธ์ (ประมวลผลที่ฝั่ง server)</figcaption>
        <div class="image-box">
          <div id="result-placeholder" class="placeholder">รอผลลัพธ์การประมวลผล</div>
          <img id="result-image" alt="ภาพผลลัพธ์" style="display: none;">
        </div>
        <a id="download-btn" class="download" download="result.png" style="display: none;">บันทึกภาพผลลัพธ์</a>
      </figure>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
